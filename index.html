---
layout: default
---
<section class="intro">
  <img class="avatar" src="{{ '/assets/img/avatar.jpg' | relative_url }}" alt="OSANNnn" width="120" height="120">
  <div>
    <h1 class="glitch" data-t="Next Frame">Next Frame</h1>
    <p class="pitch">a game/graphics programming blog</p>
  </div>
</section>

<section class="posts" aria-label="Posts">
  {%- for post in site.posts %}
  <a class="post-card" href="{{ post.url | relative_url }}">
    <p class="card-meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%-d %b %Y' }}</time>
      {%- if post.kicker %} · {{ post.kicker }}{% endif %}
    </p>
    <h2>{{ post.title }}</h2>
    {%- if post.description %}
    <p>{{ post.description }}</p>
    {%- endif %}
    <span class="more">Read →</span>
  </a>
  {%- endfor %}
</section>
